services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: docureader-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: qwen/qwen3.8-27b
      - key: DOCUREADER_JWT_SECRET
        generateValue: true
      - key: DOCUREADER_CORS_ALLOWED_ORIGINS
        value: https://*.onrender.com,http://localhost:4200

  # 2. Angular Frontend Static Site
  - type: web
    name: docureader-frontend
    runtime: static
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    staticPublishPath: frontend/dist/docureader-frontend
    routes:
      - type: rewrite
        source: /api/*
        destination: https://docureader-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
