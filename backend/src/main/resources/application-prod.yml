spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/docureader}
    username: ${SPRING_DATASOURCE_USERNAME:docureader}
    password: ${SPRING_DATASOURCE_PASSWORD:docureader_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
