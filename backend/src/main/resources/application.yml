server:
  port: ${PORT:8080}

spring:
  application:
    name: docureader-ai-backend
  datasource:
    url: jdbc:h2:mem:docureaderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

docureader:
  redis:
    enabled: ${DOCUREADER_REDIS_ENABLED:false}
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:qwen/qwen3.8-27b}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    base-url: ${OPENAI_BASE_URL:https://api.groq.com/openai/v1}
  rag:
    chunk-size: 500
    chunk-overlap: 100
    top-k: 4
    min-similarity: 0.05
  demo:
    max-queries: 5
    window-minutes: 60
    max-sessions-per-ip: 30
    max-file-size-mb: 10

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
    try-it-out-enabled: true
